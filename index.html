            }
        ];

        const ALL_9_POS = ['명사', '대명사', '수사', '관형사', '부사', '감탄사', '조사', '동사', '형용사'];

        // 5. 상태(State) 관리
        let state = {

            // 일반 단어 퀴즈 상태

            // 심화 학습 상태
            advQueue: [],

            evalSelectedAnswer: null

        // 6. 탭 전환 및 이벤트 제어
        window.setActiveTab = function(tab) {

                state.advState = 'selecting_set';

                state.evalState = 'selecting_set';
            }
            render();
        };

        window.setSelectedFunction = function(func) { state.selectedFunction = func; render(); };
        window.showSetSelection = function() { state.quizState = 'selecting_set'; render(); };
        window.showAdvSetSelection = function() { state.advState = 'selecting_set'; render(); };
        window.showEvalSelection = function() { state.evalState = 'selecting_set'; render(); };

        // 7. 형성 평가 로직 (02.html 연동 시험지 구동)
        window.startEvaluationQuiz = function() {
            // 업로드된 9개의 문제를 셔플하여 완전한 시험지 완성
            const shuffled = [...EVALUATION_QUESTIONS].sort(() => 0.5 - Math.random());
            state.evalQueue = shuffled;
            state.currentEvalIndex = 0;
            state.evalScore = 0;
            state.evalState = 'playing';
            state.evalSelectedAnswer = null;
            render();
        };

        window.handleEvalAnswer = function(optionIndex) {
            if (state.evalState !== 'playing') return;
            state.evalSelectedAnswer = optionIndex;
            
            const isCorrect = optionIndex === state.evalQueue[state.currentEvalIndex].answerIndex;
            if (isCorrect) {
                state.evalScore += 1;
                state.evalState = 'correct';
            } else {
                state.evalState = 'incorrect';
            }
            render();
        };

        window.nextEvalQuestion = function() {
            if (state.currentEvalIndex < state.evalQueue.length - 1) {
                state.currentEvalIndex += 1;
                state.evalState = 'playing';
                state.evalSelectedAnswer = null;
            } else {
                state.evalState = 'finished';
            }
            render();
        };

        // 심화 학습 로직
        window.startAdvancedQuiz = function(setIndex) {
            const shuffled = [...ADVANCED_QUESTIONS].sort(() => 0.5 - Math.random()).slice(0, 10);
            state.advQueue = shuffled;
            state.currentSet = setIndex;
            state.currentAdvIndex = 0;
            state.advScore = 0;
            state.advState = 'playing';
            state.advSelectedAnswer = null;
            render();
        };

        window.handleAdvAnswer = function(optionIndex) {
            if (state.advState !== 'playing') return;
            state.advSelectedAnswer = optionIndex;
            
            const isCorrect = optionIndex === state.advQueue[state.currentAdvIndex].answerIndex;
            if (isCorrect) {
                state.advScore += 1;
                state.advState = 'correct';
            } else {
                state.advState = 'incorrect';
            }
            render();
        };

        window.nextAdvQuestion = function() {
            if (state.currentAdvIndex < state.advQueue.length - 1) {
                state.currentAdvIndex += 1;
                state.advState = 'playing';
                state.advSelectedAnswer = null;
            } else {
                state.advState = 'finished';
            }
            render();
        };

        // 일반 단어 퀴즈 함수
        window.startQuiz = function(setIndex) {
            const startIndex = setIndex * 10;
            const setWords = ALL_QUIZ_WORDS.slice(startIndex, startIndex + 10);
            state.quizQueue = [...setWords].sort(() => 0.5 - Math.random());
            state.currentSet = setIndex;
            state.currentQuizIndex = 0;
            state.score = 0;
            state.quizState = 'playing';
            state.selectedAnswer = '';
            render();
        };

        window.handleAnswer = function(pos) {
            if (state.quizState !== 'playing') return;
            state.selectedAnswer = pos;
            if (pos === state.quizQueue[state.currentQuizIndex].answer) {
                state.score += 1;
                state.quizState = 'correct';
            } else {
                state.quizState = 'incorrect';
            }
            render();
        };

        window.nextQuestion = function() {
            if (state.currentQuizIndex < state.quizQueue.length - 1) {
                state.currentQuizIndex += 1;
                state.quizState = 'playing';
                state.selectedAnswer = '';
            } else {
                state.quizState = 'finished';
            }
            render();
        };

        // 8. 렌더링 파트
        function renderLearnTab() {

                            ${POS_DATA[state.selectedFunction].items.map(item => `<div class="bg-indigo-50/50 rounded-2xl p-6 border border-indigo-100 mb-4"><h3 class="text-2xl font-bold text-indigo-700 mb-3">${item.name}</h3><p class="text-slate-700 mb-4">${item.desc}</p></div>`).join('')}

        function renderEvaluationTab() {

                                엄격한 형태 변화 구별 능력과 품사 성질 해독력을 정밀 측정합니다.

                        </div>
                    </div>

            if (state.evalState === 'finished') {
                const percentage = Math.round((state.evalScore / state.evalQueue.length) * 100);
                return `
                    <div class="max-w-2xl mx-auto">

                                ${!isCorrect ? `<p class="text-slate-600 mt-1">정답은 <span class="font-bold text-red-600">${currentWord.answer}</span> 입니다.</p>` : ''}
                            </div>
                        </div>
                        <button onclick="nextQuestion()" class="flex items-center px-6 py-3 rounded-xl font-bold text-white transition-colors ${isCorrect ? 'bg-green-600 hover:bg-green-700' : 'bg-red-600 hover:bg-red-700'}">
                            다음 문제 <i data-lucide="arrow-right" class="w-5 h-5 ml-2"></i>
                        </button>
                    </div>
                `;
            }

            return `
                <div class="max-w-2xl mx-auto">
                    <div class="mb-4">
                        <button onclick="showSetSelection()" class="text-slate-500 hover:text-indigo-600 flex items-center font-medium transition-colors">
                            <i data-lucide="arrow-left" class="w-4 h-4 mr-1"></i> 세트 목록으로
                        </button>
                    </div>
                    <div class="bg-white rounded-2xl shadow-xl overflow-hidden border border-slate-100">
                        <div class="bg-indigo-600 p-6 text-white text-center relative">
                            <div class="absolute top-4 left-6 text-indigo-200 font-medium">
                                문제 ${state.currentQuizIndex + 1} / 10
                            </div>
                            <div class="absolute top-4 right-6 text-indigo-200 font-medium">
                                점수: ${state.score}
                            </div>
                            <h2 class="text-xl font-medium text-indigo-100 mt-6 mb-2">[세트 ${state.currentSet + 1}] 다음 단어의 품사는 무엇일까요?</h2>
                            <div class="text-5xl font-extrabold py-8 tracking-wider">
                                "${currentWord.word}"
                            </div>
                        </div>
                        
                        <div class="p-8">
                            <div class="grid grid-cols-3 gap-3 md:gap-4 mb-8">
                                ${buttonsHtml}
                            </div>
                            ${feedbackHtml}
                        </div>
                    </div>
                </div>
            `;
        }

        // 심화 학습 탭 렌더링
        function renderAdvancedTab() {
            if (state.advState === 'selecting_set') {
                const setButtons = Array.from({length: 5}, (_, i) => `
                    <button onclick="startAdvancedQuiz(${i})" class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 hover:border-purple-400 hover:shadow-md transition-all flex flex-col items-center justify-center group">
                        <div class="bg-purple-100 text-purple-600 w-12 h-12 rounded-full flex items-center justify-center font-bold text-xl mb-3 group-hover:bg-purple-600 group-hover:text-white transition-colors">
                            ${i + 1}
                        </div>
                        <span class="font-bold text-slate-700">심화 세트 ${i + 1}</span>
                    </button>
                `).join('');

                return `
                    <div class="max-w-4xl mx-auto">
                        <div class="bg-purple-50 rounded-2xl p-8 text-center mb-8 border border-purple-100">
                            <h2 class="text-2xl font-bold text-purple-900 mb-2">심화 문제 세트를 선택하세요!</h2>
                            <p class="text-slate-600">제공된 기출문제가 무작위로 10개씩 섞여서 출제됩니다.</p>
                        </div>
                        <div class="grid grid-cols-2 md:grid-cols-5 gap-4">
                            ${setButtons}
                        </div>
                    </div>
                `;
            }

            if (state.advState === 'finished') {
                return `
                    <div class="max-w-2xl mx-auto">
                        <div class="bg-white rounded-2xl shadow-xl p-10 text-center border border-slate-100">
                            <h2 class="text-3xl font-bold text-purple-900 mb-4">심화 세트 완료! 🎉</h2>
                            <p class="text-xl text-slate-600 mb-8">10문제 중 <span class="font-extrabold text-purple-600 text-2xl">${state.advScore}</span>문제를 맞혔습니다.</p>
                            <div class="w-full bg-slate-100 rounded-full h-4 mb-8 overflow-hidden">
                                <div class="bg-purple-500 h-4 rounded-full transition-all duration-1000" style="width: ${(state.advScore / state.advQueue.length) * 100}%"></div>
                            </div>
                            <div class="flex justify-center space-x-4">
                                <button onclick="showAdvSetSelection()" class="bg-purple-600 hover:bg-purple-700 text-white px-6 py-3 rounded-xl font-bold transition-colors">
                                    세트 다시 선택하기
                                </button>
                            </div>
                        </div>
                    </div>
                `;
            }

            const currentQ = state.advQueue[state.currentAdvIndex];
            
            const optionsHtml = currentQ.options.map((opt, idx) => {
                const isSelected = state.advSelectedAnswer === idx;
                const isCorrectAns = currentQ.answerIndex === idx;
                
                let btnStyle = "bg-white text-slate-900 border-slate-300 hover:bg-purple-50 hover:border-purple-400 font-medium";
                
                if (state.advState !== 'playing') {
                    if (isCorrectAns) {
                        btnStyle = "bg-green-100 text-green-800 border-green-500 font-bold shadow-sm";
                    } else if (isSelected && !isCorrectAns) {
                        btnStyle = "bg-red-100 text-red-800 border-red-400 font-bold";
                    } else {
                        btnStyle = "bg-slate-100 text-slate-500 border-slate-200 cursor-not-allowed";
                    }
                }

                return `<button onclick="handleAdvAnswer(${idx})" ${state.advState !== 'playing' ? 'disabled' : ''} class="w-full text-left p-4 rounded-xl border-2 transition-all ${btnStyle}">
                    <span class="mr-2 font-extrabold text-indigo-600">${idx + 1}.</span> ${opt}
                </button>`;
            }).join('');

            return `
                <div class="max-w-3xl mx-auto">
                    <div class="mb-4">
                        <button onclick="showAdvSetSelection()" class="text-slate-500 hover:text-purple-600 flex items-center font-medium transition-colors">
                            <i data-lucide="arrow-left" class="w-4 h-4 mr-1"></i> 세트 목록으로
                        </button>
                    </div>
                    <div class="bg-white rounded-2xl shadow-xl overflow-hidden border border-slate-100">
                        <div class="bg-purple-600 p-6 text-white relative">
                            <div class="flex justify-between text-purple-200 font-medium mb-4">
                                <span>문제 ${state.currentAdvIndex + 1} / ${state.advQueue.length}</span>
                                <span>점수: ${state.advScore}</span>
                            </div>
                            <h2 class="text-xl font-bold leading-relaxed">${currentQ.q}</h2>
                        </div>
                        
                        <div class="p-6 md:p-8 space-y-3">
                            ${optionsHtml}
                        </div>
                        
                        ${state.advState !== 'playing' ? `
                        <div class="p-6 bg-slate-50 border-t border-slate-100 flex justify-between items-center">
                            <div class="font-extrabold text-lg ${state.advState === 'correct' ? 'text-green-700' : 'text-red-700'}">
                                ${state.advState === 'correct' ? '정답입니다! 🎉' : '아쉽네요, 다시 분석해 볼까요?'}
                            </div>
                            <button onclick="nextAdvQuestion()" class="bg-purple-600 hover:bg-purple-700 text-white px-6 py-3 rounded-xl font-bold flex items-center transition-colors">
                                다음 문제 <i data-lucide="arrow-right" class="w-5 h-5 ml-2"></i>
                            </button>
                        </div>
                        ` : ''}
                    </div>
                </div>
            `;
        }

        // 전체 화면 어셈블리 렌더링
        function render() {
            const app = document.getElementById('app');
            let content = '';
            
            if(state.activeTab === 'learn') content = renderLearnTab();
            else if(state.activeTab === 'quiz') content = renderQuizTab();
            else if(state.activeTab === 'advanced') content = renderAdvancedTab();
            else if(state.activeTab === 'evaluation') content = renderEvaluationTab();

            app.innerHTML = `
                <header class="text-center mb-10">
                    <h1 class="text-3xl md:text-4xl font-extrabold text-indigo-700 mb-3 tracking-tight">국어 품사 마스터</h1>
                    <p class="text-slate-500 font-medium text-sm">중학교 교육과정 맞춤식 품사 완성 솔루션</p>
                </header>

                <div class="flex flex-wrap justify-center gap-2 md:gap-4 mb-8">
                    <button onclick="setActiveTab('learn')" class="flex items-center px-4 md:px-6 py-3 rounded-full font-semibold transition-all ${state.activeTab === 'learn' ? 'bg-indigo-600 text-white shadow-md' : 'bg-white text-slate-600 hover:bg-indigo-50'}">
                        학습하기
                    </button>
                    <button onclick="setActiveTab('quiz')" class="flex items-center px-4 md:px-6 py-3 rounded-full font-semibold transition-all ${state.activeTab === 'quiz' ? 'bg-indigo-600 text-white shadow-md' : 'bg-white text-slate-600 hover:bg-indigo-50'}">
                        단어 퀴즈
                    </button>
                    <button onclick="setActiveTab('advanced')" class="flex items-center px-4 md:px-6 py-3 rounded-full font-semibold transition-all ${state.activeTab === 'advanced' ? 'bg-indigo-600 text-white shadow-md' : 'bg-white text-slate-600 hover:bg-indigo-50'}">
                        심화 학습
                    </button>
                    <!-- 신규 형성 평가 (01.html 연동 영역) 탭 탑재 -->
                    <button onclick="setActiveTab('evaluation')" class="flex items-center px-4 md:px-6 py-3 rounded-full font-bold border-2 transition-all ${state.activeTab === 'evaluation' ? 'bg-emerald-600 border-emerald-600 text-white shadow-lg shadow-emerald-600/20' : 'bg-white border-emerald-500 text-emerald-700 hover:bg-emerald-50'}">
                        <i data-lucide="file-check" class="w-5 h-5 mr-1.5"></i>
                        형성 평가
                    </button>
                </div>

                ${content}
            `;
            lucide.createIcons();
        }

        render();
    </script>
</body>
</html>
