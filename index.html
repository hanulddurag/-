<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>국어 품사 마스터</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="min-h-screen bg-slate-50 text-slate-800 font-sans p-4 md:p-8">
    
    <div id="app" class="max-w-5xl mx-auto">
        <!-- 렌더링될 메인 컨테이너 -->
    </div>

    <script>
        // 1. 품사 데이터 정의
        const POS_DATA = {
            체언: {
                form: '불변어',
                desc: '문장에서 주로 주어의 역할을 하며, 형태가 변하지 않는 단어들입니다.',
                items: [
                    { id: '명사', name: '명사', desc: '사람이나 사물, 장소, 보이지 않는 것의 이름을 나타냅니다.', examples: ['하늘', '바다', '사랑', '학교'] },
                    { id: '대명사', name: '대명사', desc: '명사를 대신하여 사람, 사물, 장소를 가리킵니다.', examples: ['나', '너', '우리', '이것', '저기'] },
                    { id: '수사', name: '수사', desc: '사물의 수량이나 순서를 나타냅니다.', examples: ['하나', '둘', '첫째', '둘째'] },
                ]
        // 2. 퀴즈 단어장 (중학생 필수 단어 100개, 10개씩 10세트 분량)
        const ALL_QUIZ_WORDS = [
            // 세트 1 (0-9)
            { word: '평화', answer: '명사' }, { word: '스스로', answer: '대명사' }, { word: '하나', answer: '수사' }, { word: '새', answer: '관형사' }, { word: '과연', answer: '부사' },
            { word: '앗', answer: '감탄사' }, { word: '부터', answer: '조사' }, { word: '실천하다', answer: '동사' }, { word: '다채롭다', answer: '형용사' }, { word: '갈등', answer: '명사' },
            // 세트 2 (10-19)
            { word: '환경', answer: '명사' }, { word: '저희', answer: '대명사' }, { word: '둘째', answer: '수사' }, { word: '헌', answer: '관형사' }, { word: '무척', answer: '부사' },
            { word: '어머나', answer: '감탄사' }, { word: '까지', answer: '조사' }, { word: '탐구하다', answer: '동사' }, { word: '올바르다', answer: '형용사' }, { word: '정보', answer: '명사' },
            // 세트 3 (20-29)
            { word: '문화', answer: '명사' }, { word: '거기', answer: '대명사' }, { word: '수십', answer: '수사' }, { word: '첫', answer: '관형사' }, { word: '일찍', answer: '부사' },
            { word: '자', answer: '감탄사' }, { word: '에게', answer: '조사' }, { word: '발전하다', answer: '동사' }, { word: '성실하다', answer: '형용사' }, { word: '세포', answer: '명사' },
            // 세트 4 (30-39)
            { word: '책임', answer: '명사' }, { word: '무엇', answer: '대명사' }, { word: '삼', answer: '수사' }, { word: '옛', answer: '관형사' }, { word: '가득', answer: '부사' },
            { word: '옳지', answer: '감탄사' }, { word: '으로', answer: '조사' }, { word: '존중하다', answer: '동사' }, { word: '평화롭다', answer: '형용사' }, { word: '역사', answer: '명사' },
            // 세트 5 (40-49)
            { word: '권리', answer: '명사' }, { word: '누구', answer: '대명사' }, { word: '백', answer: '수사' }, { word: '온갖', answer: '관형사' }, { word: '안', answer: '부사' },
            { word: '참', answer: '감탄사' }, { word: '조차', answer: '조사' }, { word: '배려하다', answer: '동사' }, { word: '심각하다', answer: '형용사' }, { word: '가치', answer: '명사' },
            // 세트 6 (50-59)
            { word: '평등', answer: '명사' }, { word: '어디', answer: '대명사' }, { word: '천', answer: '수사' }, { word: '갖은', answer: '관형사' }, { word: '못', answer: '부사' },
            { word: '허허', answer: '감탄사' }, { word: '마저', answer: '조사' }, { word: '노력하다', answer: '동사' }, { word: '투명하다', answer: '형용사' }, { word: '생태계', answer: '명사' },
            // 세트 7 (60-69)
            { word: '인권', answer: '명사' }, { word: '아무', answer: '대명사' }, { word: '만', answer: '수사' }, { word: '여러', answer: '관형사' }, { word: '설마', answer: '부사' },
            { word: '아이구', answer: '감탄사' }, { word: '처럼', answer: '조사' }, { word: '돕다', answer: '동사' }, { word: '둥글다', answer: '형용사' }, { word: '우정', answer: '명사' },
            // 세트 8 (70-79)
            { word: '개성', answer: '명사' }, { word: '당신', answer: '대명사' }, { word: '셋째', answer: '수사' }, { word: '무슨', answer: '관형사' }, { word: '빨리', answer: '부사' },
            { word: '에구', answer: '감탄사' }, { word: '만큼', answer: '조사' }, { word: '듣다', answer: '동사' }, { word: '파랗다', answer: '형용사' }, { word: '사회', answer: '명사' },
            // 세트 9 (80-89)
            { word: '미래', answer: '명사' }, { word: '그대', answer: '대명사' }, { word: '넷째', answer: '수사' }, { word: '어떤', answer: '관형사' }, { word: '매우', answer: '부사' },
            { word: '야호', answer: '감탄사' }, { word: '을/를', answer: '조사' }, { word: '묻다', answer: '동사' }, { word: '아름답다', answer: '형용사' }, { word: '진로', answer: '명사' },
            // 세트 10 (90-99)
            { word: '경제', answer: '명사' }, { word: '이것', answer: '대명사' }, { word: '다섯', answer: '수사' }, { word: '웬', answer: '관형사' }, { word: '방긋방긋', answer: '부사' },
            { word: '네', answer: '감탄사' }, { word: '은/는', answer: '조사' }, { word: '극복하다', answer: '동사' }, { word: '험난하다', answer: '형용사' }, { word: '민족', answer: '명사' }
        ];

        const ALL_9_POS = ['명사', '대명사', '수사', '관형사', '부사', '감탄사', '조사', '동사', '형용사'];

        // 3. 상태(State) 관리
        let state = {
            activeTab: 'learn',
            selectedFunction: '체언',
            quizQueue: [],
            currentQuizIndex: 0,
            score: 0,
            quizState: 'selecting_set', // selecting_set, playing, correct, incorrect, finished
            selectedAnswer: '',
            currentSet: 0
        };

        // 4. 상태 변경 함수
        window.setActiveTab = function(tab) {
            state.activeTab = tab;
            if (tab === 'quiz') {
                if (state.quizState === 'finished' || state.quizQueue.length === 0) {
                    state.quizState = 'selecting_set';
                }
            }
            render();
        };

        window.showSetSelection = function() {
            state.quizState = 'selecting_set';
            render();
        };

        window.setSelectedFunction = function(func) {
            state.selectedFunction = func;
            render();
        };

        window.startQuiz = function(setIndex) {
            const startIndex = setIndex * 10;
            const setWords = ALL_QUIZ_WORDS.slice(startIndex, startIndex + 10);
            
            // 선택된 세트의 10문제를 랜덤하게 섞음 (매번 다른 순서로 출제)
            const shuffled = [...setWords].sort(() => 0.5 - Math.random());
            
            state.quizQueue = shuffled;
            state.currentSet = setIndex;
            state.currentQuizIndex = 0;
            state.score = 0;
            state.quizState = 'playing';
            state.selectedAnswer = '';
            render();
        };

        window.handleAnswer = function(pos) {
            if (state.quizState !== 'playing') return;
            
            state.selectedAnswer = pos;
            const isCorrect = pos === state.quizQueue[state.currentQuizIndex].answer;
            
            if (isCorrect) {
                state.score += 1;
                state.quizState = 'correct';
            } else {
                state.quizState = 'incorrect';
            }
            render();
        };

        window.nextQuestion = function() {
            if (state.currentQuizIndex < state.quizQueue.length - 1) {
                state.currentQuizIndex += 1;
                state.quizState = 'playing';
                state.selectedAnswer = '';
            } else {
                state.quizState = 'finished';
            }
            render();
        };

        // 5. 렌더링 로직
        function renderLearnTab() {
            const sidebarHtml = Object.keys(POS_DATA).map(func => {
                const isSelected = state.selectedFunction === func;
                return `
                    <button
                        onclick="setSelectedFunction('${func}')"
                        class="w-full text-left px-5 py-4 rounded-xl font-medium transition-all border ${isSelected ? 'bg-indigo-600 text-white shadow-md border-transparent' : 'bg-white text-slate-700 hover:bg-indigo-100 border-slate-200'}"
                    >
                        <div class="flex justify-between items-center">
                            <span class="text-lg">${func}</span>
                            <span class="text-xs px-2 py-1 rounded-full ${isSelected ? 'bg-indigo-500 text-white' : 'bg-slate-100 text-slate-500'}">
                                ${POS_DATA[func].form}
                            </span>
                        </div>
                    </button>
                `;
            }).join('');

            const itemsHtml = POS_DATA[state.selectedFunction].items.map(item => `
                <div class="bg-indigo-50/50 rounded-2xl p-6 border border-indigo-100 hover:shadow-md transition-shadow">
                    <div class="flex items-center mb-3">
                        <h3 class="text-2xl font-bold text-indigo-700">${item.name}</h3>
                    </div>
                    <p class="text-slate-700 mb-4 text-lg">${item.desc}</p>
                    <div class="bg-white rounded-xl p-4 border border-indigo-50">
                        <span class="text-sm font-bold text-indigo-400 block mb-2">대표적인 예시</span>
                        <div class="flex flex-wrap gap-2">
                            ${item.examples.map(ex => `<span class="bg-slate-100 text-slate-800 px-3 py-1.5 rounded-lg text-sm font-medium">${ex}</span>`).join('')}
                        </div>
                    </div>
                </div>
            `).join('');

            return `
                <div class="bg-white rounded-2xl shadow-xl overflow-hidden border border-slate-100">
                    <div class="bg-indigo-50 p-6 border-b border-indigo-100 grid grid-cols-1 md:grid-cols-3 gap-4 text-center">
                        <div class="bg-white p-4 rounded-xl shadow-sm">
                            <h3 class="font-bold text-indigo-800 mb-2">1. 형태 (모양)</h3>
                            <p class="text-sm text-slate-600">단어의 형태가 변하는가?<br/>(불변어, 가변어)</p>
                        </div>
                        <div class="bg-white p-4 rounded-xl shadow-sm">
                            <h3 class="font-bold text-indigo-800 mb-2">2. 기능 (역할)</h3>
                            <p class="text-sm text-slate-600">문장에서 어떤 역할을 하는가?<br/>(체언, 수식언, 독립언, 관계언, 용언)</p>
                        </div>
                        <div class="bg-white p-4 rounded-xl shadow-sm">
                            <h3 class="font-bold text-indigo-800 mb-2">3. 의미 (뜻)</h3>
                            <p class="text-sm text-slate-600">어떤 의미를 가지고 있는가?<br/>(명사, 대명사 등 9품사)</p>
                        </div>
                    </div>
                    <div class="flex flex-col md:flex-row">
                        <div class="md:w-1/3 bg-slate-50 p-6 border-r border-slate-100">
                            <h2 class="text-lg font-bold text-slate-700 mb-4 flex items-center">
                                <i data-lucide="info" class="w-5 h-5 mr-2 text-indigo-500"></i>
                                기능에 따른 분류
                            </h2>
                            <div class="space-y-3">
                                ${sidebarHtml}
                            </div>
                        </div>
                        <div class="md:w-2/3 p-6 md:p-8">
                            <div class="mb-6 pb-4 border-b border-slate-100">
                                <h2 class="text-3xl font-extrabold text-indigo-900 mb-2">${state.selectedFunction}</h2>
                                <p class="text-slate-600 text-lg">${POS_DATA[state.selectedFunction].desc}</p>
                            </div>
                            <div class="space-y-6">
                                ${itemsHtml}
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderQuizTab() {
            if (state.quizState === 'selecting_set') {
                const setButtons = Array.from({length: 10}, (_, i) => `
                    <button onclick="startQuiz(${i})" class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 hover:border-indigo-400 hover:shadow-md transition-all flex flex-col items-center justify-center group">
                        <div class="bg-indigo-100 text-indigo-600 w-12 h-12 rounded-full flex items-center justify-center font-bold text-xl mb-3 group-hover:bg-indigo-600 group-hover:text-white transition-colors">
                            ${i + 1}
                        </div>
                        <span class="font-bold text-slate-700">세트 ${i + 1}</span>
                    </button>
                `).join('');

                return `
                    <div class="max-w-4xl mx-auto">
                        <div class="bg-indigo-50 rounded-2xl p-8 text-center mb-8 border border-indigo-100">
                            <h2 class="text-2xl font-bold text-indigo-900 mb-2">도전할 문제 세트를 선택하세요!</h2>
                            <p class="text-slate-600">중학생 필수 어휘 100개가 10문제씩 10개의 세트로 준비되어 있습니다.</p>
                        </div>
                        <div class="grid grid-cols-2 md:grid-cols-5 gap-4">
                            ${setButtons}
                        </div>
                    </div>
                `;
            }

            if (state.quizQueue.length === 0) return '';

            if (state.quizState === 'finished') {
                return `
                    <div class="max-w-2xl mx-auto">
                        <div class="bg-white rounded-2xl shadow-xl p-10 text-center border border-slate-100">
                            <h2 class="text-3xl font-bold text-indigo-900 mb-4">세트 ${state.currentSet + 1} 완료! 🎉</h2>
                            <p class="text-xl text-slate-600 mb-8">10문제 중 <span class="font-extrabold text-indigo-600 text-2xl">${state.score}</span>문제를 맞혔습니다.</p>
                            <div class="w-full bg-slate-100 rounded-full h-4 mb-8 overflow-hidden">
                                <div class="bg-indigo-500 h-4 rounded-full transition-all duration-1000" style="width: ${(state.score / 10) * 100}%"></div>
                            </div>
                            <div class="flex justify-center space-x-4">
                                <button 
                                    onclick="startQuiz(${state.currentSet})"
                                    class="bg-white border-2 border-indigo-600 text-indigo-600 hover:bg-indigo-50 px-6 py-3 rounded-xl font-bold transition-colors"
                                >
                                    다시 풀기
                                </button>
                                <button 
                                    onclick="showSetSelection()"
                                    class="bg-indigo-600 hover:bg-indigo-700 text-white px-6 py-3 rounded-xl font-bold transition-colors"
                                >
                                    다른 세트 선택
                                </button>
                            </div>
                        </div>
                    </div>
                `;
            }

            const currentWord = state.quizQueue[state.currentQuizIndex];
            
            const buttonsHtml = ALL_9_POS.map(pos => {
                const isSelected = state.selectedAnswer === pos;
                const isCorrectAnswer = currentWord.answer === pos;
                
                let btnStyle = "bg-slate-50 text-slate-700 border-slate-200 hover:bg-indigo-50 hover:border-indigo-200";
                
                if (state.quizState !== 'playing') {
                    if (isCorrectAnswer) {
                        btnStyle = "bg-green-100 text-green-800 border-green-300 shadow-inner";
                    } else if (isSelected && !isCorrectAnswer) {
                        btnStyle = "bg-red-100 text-red-800 border-red-300";
                    } else {
                        btnStyle = "bg-slate-50 text-slate-400 border-slate-100 opacity-50 cursor-not-allowed";
                    }
                }

                return `
                    <button
                        onclick="handleAnswer('${pos}')"
                        ${state.quizState !== 'playing' ? 'disabled' : ''}
                        class="py-4 rounded-xl border-2 font-bold text-lg transition-all ${btnStyle}"
                    >
                        ${pos}
                    </button>
                `;
            }).join('');

            let feedbackHtml = '';
            if (state.quizState !== 'playing') {
                const isCorrect = state.quizState === 'correct';
                feedbackHtml = `
                    <div class="p-6 rounded-xl flex items-center justify-between ${isCorrect ? 'bg-green-50' : 'bg-red-50'}">
                        <div class="flex items-center">
                            <i data-lucide="${isCorrect ? 'check-circle-2' : 'x-circle'}" class="w-8 h-8 ${isCorrect ? 'text-green-500' : 'text-red-500'} mr-3"></i>
                            <div>
                                <p class="font-bold text-lg ${isCorrect ? 'text-green-800' : 'text-red-800'}">
                                    ${isCorrect ? '정답입니다!' : '틀렸습니다!'}
                                </p>
                                ${!isCorrect ? `<p class="text-slate-600 mt-1">정답은 <span class="font-bold text-red-600">${currentWord.answer}</span> 입니다.</p>` : ''}
                            </div>
                        </div>
                        <button 
                            onclick="nextQuestion()"
                            class="flex items-center px-6 py-3 rounded-xl font-bold text-white transition-colors ${isCorrect ? 'bg-green-600 hover:bg-green-700' : 'bg-red-600 hover:bg-red-700'}"
                        >
                            다음 문제 <i data-lucide="arrow-right" class="w-5 h-5 ml-2"></i>
                        </button>
                    </div>
                `;
            }

            return `
                <div class="max-w-2xl mx-auto">
                    <div class="mb-4">
                        <button onclick="showSetSelection()" class="text-slate-500 hover:text-indigo-600 flex items-center font-medium transition-colors">
                            <i data-lucide="arrow-left" class="w-4 h-4 mr-1"></i> 세트 목록으로
                        </button>
                    </div>
                    <div class="bg-white rounded-2xl shadow-xl overflow-hidden border border-slate-100">
                        <div class="bg-indigo-600 p-6 text-white text-center relative">
                            <div class="absolute top-4 left-6 text-indigo-200 font-medium">
                                문제 ${state.currentQuizIndex + 1} / 10
                            </div>
                            <div class="absolute top-4 right-6 text-indigo-200 font-medium">
                                점수: ${state
