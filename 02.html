<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>국어 품사 형성 평가</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700;800&display=swap');
        
        body {
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
            background: linear-gradient(135deg, #f5f7fb 0%, #e4ecf7 100%);
        }
        .custom-shadow { box-shadow: 0 10px 30px -5px rgba(79, 70, 229, 0.08), 0 1px 3px 0 rgba(0, 0, 0, 0.03); }
        .preserve-whitespace { white-space: pre-wrap; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: rgba(0,0,0,0.02); }
        ::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.1); border-radius: 4px; }
    </style>
</head>
<body class="min-h-screen py-6 px-4 flex items-center justify-center">

    <div class="w-full max-w-3xl bg-white rounded-3xl custom-shadow overflow-hidden border border-slate-100 flex flex-col my-auto">
        
        <!-- Header -->
        <div class="bg-gradient-to-r from-indigo-600 to-blue-600 p-6 text-white relative">
            <h1 class="text-2xl font-bold tracking-tight">국어 품사 형성 평가</h1>
            <p class="text-indigo-100 text-sm mt-1">단어의 분류 기준(형태, 기능, 의미)을 점검합니다.</p>
        </div>

        <!-- 1. Intro & Student Info Screen -->
        <div id="intro-screen" class="p-8 flex-1 flex flex-col items-center justify-center">
            <div class="w-16 h-16 bg-indigo-50 text-indigo-500 rounded-full flex items-center justify-center mb-6">
                <i data-lucide="user-check" class="w-8 h-8"></i>
            </div>
            <h2 class="text-xl font-bold text-slate-800 mb-2">응시자 정보 입력</h2>
            <p class="text-slate-500 text-sm mb-8 text-center">시험을 시작하기 전에 학년, 반, 번호, 이름을 정확하게 입력해 주세요.</p>

            <div class="grid grid-cols-2 gap-4 w-full max-w-md mb-8">
                <div>
                    <label class="block text-xs font-bold text-slate-500 mb-1">학년</label>
                    <input type="number" id="input-grade" placeholder="예: 1" class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200 transition-all">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-500 mb-1">반</label>
                    <input type="number" id="input-class" placeholder="예: 3" class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200 transition-all">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-500 mb-1">번호</label>
                    <input type="number" id="input-num" placeholder="예: 15" class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200 transition-all">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-500 mb-1">이름</label>
                    <input type="text" id="input-name" placeholder="예: 홍길동" class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200 transition-all">
                </div>
            </div>

            <button id="start-btn" class="w-full max-w-md bg-indigo-600 text-white font-bold text-lg px-6 py-4 rounded-xl hover:bg-indigo-700 active:scale-[0.98] transition-all shadow-md">
                시험 시작하기
            </button>
        </div>

        <!-- 2. Quiz Screen (Hidden initially) -->
        <div id="quiz-screen" class="hidden flex-1 flex flex-col justify-between">
            <div class="p-6 bg-slate-50 border-b border-slate-100 flex justify-between items-center">
                <span class="text-sm font-bold text-slate-600">진행률: <span id="progress-text">1 / 10</span></span>
                <span class="text-sm font-bold text-indigo-600" id="student-info-display"></span>
            </div>
            
            <div class="p-6 sm:p-8 flex-1">
                <div class="flex items-start space-x-3 mb-6">
                    <span id="question-badge" class="bg-indigo-100 text-indigo-700 text-sm font-extrabold w-8 h-8 rounded-lg flex items-center justify-center shrink-0">01</span>
                    <h2 id="question-text" class="text-lg font-bold text-slate-800 leading-snug pt-0.5 preserve-whitespace">문제</h2>
                </div>

                <div id="box-container" class="hidden mb-6 bg-slate-50 border border-slate-200 rounded-xl p-5 text-sm text-slate-700 preserve-whitespace">
                    <span class="inline-block bg-slate-200 text-slate-700 text-xs font-bold px-2 py-0.5 rounded mb-2">보기</span>
                    <p id="box-content" class="font-medium"></p>
                </div>

                <div id="options-list" class="space-y-3 mb-6"></div>

                <div id="feedback-box" class="hidden mb-6 rounded-xl p-4 border">
                    <h4 id="feedback-title" class="font-bold text-sm mb-1">결과</h4>
                    <p id="feedback-rationale" class="text-sm leading-relaxed preserve-whitespace"></p>
                </div>
            </div>

            <div class="p-6 border-t border-slate-100 flex justify-end">
                <button id="action-btn" disabled class="bg-indigo-600 text-white font-semibold px-6 py-3 rounded-xl disabled:opacity-50">정답 확인</button>
            </div>
        </div>

        <!-- 3. Result Screen (Hidden initially) -->
        <div id="result-screen" class="hidden p-8 text-center flex-1 flex flex-col items-center justify-center">
            <div id="loading-spinner" class="mb-6 flex flex-col items-center">
                <div class="w-12 h-12 border-4 border-indigo-200 border-t-indigo-600 rounded-full animate-spin mb-4"></div>
                <p class="text-slate-500 font-bold">결과를 서버에 저장하는 중입니다...</p>
            </div>

            <div id="success-content" class="hidden flex-col items-center w-full">
                <div class="w-20 h-20 bg-emerald-50 text-emerald-500 rounded-full flex items-center justify-center mb-4">
                    <i data-lucide="check-circle" class="w-10 h-10"></i>
                </div>
                <h2 class="text-2xl font-bold text-slate-800 mb-2">수고하셨습니다!</h2>
                <p class="text-slate-500 text-sm mb-6">결과가 성공적으로 제출되었습니다.</p>
                
                <div class="bg-slate-50 border border-slate-100 rounded-2xl w-full max-w-sm p-6 mb-6">
                    <p class="text-sm text-slate-500 mb-1">나의 점수</p>
                    <p class="text-4xl font-extrabold text-indigo-600" id="final-score">0 / 10</p>
                </div>
            </div>
        </div>

    </div>

    <script>
        // ★ 여기에 1단계에서 복사한 구글 앱스 스크립트 웹앱 URL을 붙여넣으세요 ★
        const SCRIPT_URL = "YOUR_GOOGLE_SCRIPT_URL_HERE";

        // 문제 데이터
        const quizData = [
            { question: "다음 중 품사를 바르게 분류한 것은?", options: ["① 독립언: 조사", "② 관계언: 감탄사", "③ 용언: 관형사, 부사", "④ 수식언: 동사, 형용사", "⑤ 체언: 명사, 대명사, 수사"], answer: 4, rationale: "체언은 명사, 대명사, 수사입니다. 조사는 관계언, 감탄사는 독립언, 관형사/부사는 수식언, 동사/형용사는 용언입니다." },
            { question: "<보기>의 단어들을 문장에서 하는 역할이 같은 것끼리 적절하게 묶은 것은?", box: "어느, 꿈, 이것, 어머나, 예쁘다, 뜨겁다, 흐르다. 얼마나", options: ["① 어느, 꿈, 이것", "② 어머나. 얼마나", "③ 꿈. 이것, 어머나", "④ 예쁘다. 뜨겁다. 흐르다", "⑤ 어머나. 예쁘다. 뜨겁다"], answer: 3, rationale: "예쁘다(형용사), 뜨겁다(형용사), 흐르다(동사)는 모두 서술어 역할을 하는 '용언'입니다." },
            { question: "밑줄 친 단어 중 체언이 아닌 것은?", options: ["① 할아버지. 이것은 뭐예요?", "② 동생이 바닥에 구슬을 떨어뜨렸다.", "③ 그 사람은 형과 같은 학교를 졸업했다.", "④ 요리를 할 때에는 첫째. 손을 깨끗이 씻어야 한다.", "⑤ 우리 허락 없이는 절대 이 마을을 통과할 수 없다."], answer: 2, rationale: "③ '같은'은 형용사 '같다'의 활용형으로 용언입니다." },
            { question: "<보기>의 문장에 사용된 단어에 대한 설명으로 적절한 것은?", box: "네, 그는 친구를 두루 넓게 사겁니다.", options: ["① 형태가 변하는 말은 1개이다.", "② 기능을 기준으로 4개의 품사가 쓰였다.", "③ 의미를 기준으로 8개의 품사가 쓰였다.", "④ 다른 말과의 관계를 나타내는 역할을 하는 품사는 3개이다.", "⑤ 사용된 단어 중 1개는 생략해도 문장의 뜻이 달라지지 않는다."], answer: 4, rationale: "감탄사 '네' 또는 부사 '두루' 등 수식어/독립어는 생략해도 기본 뼈대 의미가 통하므로 ⑤가 적절합니다." },
            { question: "<보기>의 문장에 대한 설명으로 적절하지 않은 것은?", box: "• 주방장이 면을 가늘게 뽑았다.\n• 학생들은 교실 밖으로 나와서 운동장을 뛰었다.", options: ["① '가늘게'는 '면'의 상태를 나타내는 형용사이다.", "② '가늘게'. '뽑았다'. '나와서', '뛰었다'는 모두 용언에 해당한다.", "③ '뽑았다'의 기본형은 '뽑다'로, '뽑아, 뽑고' 등으로 형태가 변할 수 있다.", "④ '뽑았다'와 '뛰었다'는 각각 '주방장'과 '학생들'을 서술하는 기능을 한다.", "⑤ '나와서'는 '나와라'와 같이 명령형 어미 '-아라'와 결합할 수 있으므로 형용사이다."], answer: 4, rationale: "명령형 어미와 결합할 수 있는 품사는 '동사'이므로 ⑤번 설명은 틀렸습니다." },
            { question: "<보기>의 밑줄 친 단어의 공통점으로 적절한 것은?", box: "산 정상에 도착하니 기분이 상쾌했다. (밑줄: 상쾌했다)", options: ["① 다른 말과의 관계를 나타낸다.", "② 쓰임에 따라 문장에서 형태가 변한다.", "③ 사람이나 사물의 상태나 성질을 나타낸다.", "④ 사람이나 사물의 움직임이나 작용을 나타낸다.", "⑤ 명령형 어미 '-어라/-아라'. 청유형 어미 '-자'와 결합할 수 있다."], answer: 1, rationale: "'상쾌했다'는 형용사로 쓰임에 따라 어미가 변하는 용언(가변어)입니다." },
            { question: "<보기>의 밑줄 친 단어와 품사가 같은 것은?", box: "우리는 새 옷을 무척 좋아한다. (밑줄: 새)", options: ["① 이 기차는 부산으로 간다.", "② 드디어 오늘이 내 생일이다.", "③ 너는 어떤 음식을 가장 좋아하니?", "④ 그들은 사진을 보면서 옛 추억에 잠겼다.", "⑤ 나는 헌 신발을 신고도 운동장을 열심히 달렸다."], answer: 3, rationale: "'새'는 관형사입니다. 보기 중 ④ '옛' (또는 지시관형사 '이', 성상관형사 '헌')도 관형사입니다." },
            { question: "밑줄 친 단어가 감탄사가 아닌 것은?", options: ["① 어머! 마법을 풀러 온 거야?", "② 에헴. 이 문장에서 나를 찾아봐.", "③ 그래. 네가 원하는 대로 해 줄게.", "④ 마법. 그건 어떻게 풀어야 하는 거야?", "⑤ 이봐. 네가 문제를 풀 때마다 내가 감탄 조각을 줄게."], answer: 3, rationale: "④ '마법'은 독립적으로 쓰였으나 개념을 나타내는 '명사'입니다." },
            { question: "밑줄 친 단어 중 형태가 변하지 않는 것은?", options: ["① 이 기차는 부산으로 간다.", "② 우리 강아지는 털이 하얗다.", "③ 동생이 방에서 깔깔대며 웃었다.", "④ 사람은 한 번쯤 실수를 하기 마련이다.", "⑤ 동네 한 바퀴를 걸으며 담장 아래에 핀 꽃을 보았다."], answer: 3, rationale: "④ '마련이다' 중 '마련'은 의존명사로 형태가 불변합니다." },
            { question: "조사에 대한 설명으로 적절하지 않은 것은?", options: ["① 문장에서 단독으로 쓰일 수 없다.", "② 앞말과 쉽게 분리되는 성질이 있다.", "③ 다른 말과의 관계를 나타내는 역할을 한다.", "④ 모든 조사는 문장에서 쓰일 때 형태가 변하지 않는다.", "⑤ 주로 체언 뒤에 붙어서 그 말과 다른 말과의 문법적 관계를 나타낸다."], answer: 3, rationale: "서술격 조사 '이다'는 용언처럼 활용(형태 변화)하므로 ④번은 틀렸습니다." }
        ];

        let studentData = {};
        let currentIndex = 0;
        let score = 0;
        let isChecked = false;
        let selectedOption = null;
        let userResponses = []; // 스프레드시트로 보낼 응답 데이터

        // DOM Elements
        const introScreen = document.getElementById('intro-screen');
        const quizScreen = document.getElementById('quiz-screen');
        const resultScreen = document.getElementById('result-screen');
        const startBtn = document.getElementById('start-btn');
        const actionBtn = document.getElementById('action-btn');
        const optionsList = document.getElementById('options-list');
        const feedbackBox = document.getElementById('feedback-box');
        
        lucide.createIcons();

        // 1. 시작 버튼 클릭 (학생 정보 검증)
        startBtn.onclick = () => {
            const grade = document.getElementById('input-grade').value.trim();
            const classNum = document.getElementById('input-class').value.trim();
            const num = document.getElementById('input-num').value.trim();
            const name = document.getElementById('input-name').value.trim();

            if(!grade || !classNum || !num || !name) {
                alert("학년, 반, 번호, 이름을 모두 입력해 주세요.");
                return;
            }

            studentData = { grade, classNum, num, name };
            document.getElementById('student-info-display').textContent = `${grade}학년 ${classNum}반 ${name}`;
            
            introScreen.classList.add('hidden');
            quizScreen.classList.remove('hidden');
            renderQuestion();
        };

        // 2. 문제 화면 렌더링
        function renderQuestion() {
            const currentData = quizData[currentIndex];
            isChecked = false;
            selectedOption = null;
            actionBtn.disabled = true;
            actionBtn.textContent = "정답 확인";
            feedbackBox.classList.add('hidden');
            optionsList.innerHTML = '';

            document.getElementById('progress-text').textContent = `${currentIndex + 1} / 10`;
            document.getElementById('question-badge').textContent = String(currentIndex + 1).padStart(2, '0');
            document.getElementById('question-text').textContent = currentData.question;

            if(currentData.box) {
                document.getElementById('box-container').classList.remove('hidden');
                document.getElementById('box-content').textContent = currentData.box;
            } else {
                document.getElementById('box-container').classList.add('hidden');
            }

            currentData.options.forEach((opt, idx) => {
                const btn = document.createElement('button');
                btn.className = "w-full text-left p-4 rounded-xl border border-slate-200 bg-white hover:bg-slate-50 text-slate-700 font-medium text-sm transition-all";
                btn.innerHTML = `<span>${opt}</span><span class="indicator w-5 h-5 rounded-full border border-slate-300 flex items-center justify-center shrink-0"></span>`;
                btn.onclick = () => selectOption(idx);
                optionsList.appendChild(btn);
            });
        }

        // 보기 선택
        function selectOption(idx) {
            if (isChecked) return;
            selectedOption = idx;
            actionBtn.disabled = false;
            
            const buttons = optionsList.querySelectorAll('button');
            buttons.forEach((btn, i) => {
                if (i === idx) {
                    btn.className = "w-full text-left p-4 rounded-xl border-2 border-indigo-600 bg-indigo-50 font-bold text-indigo-900 text-sm";
                    btn.querySelector('.indicator').className = "indicator w-5 h-5 rounded-full bg-indigo-600 border-2 border-indigo-600";
                } else {
                    btn.className = "w-full text-left p-4 rounded-xl border border-slate-200 bg-white text-slate-700 font-medium text-sm";
                    btn.querySelector('.indicator').className = "indicator w-5 h-5 rounded-full border border-slate-300";
                }
            });
        }

        // 3. 정답 확인 및 다음 진행
        actionBtn.onclick = () => {
            const currentData = quizData[currentIndex];

            if (!isChecked) {
                // 채점 처리
                isChecked = true;
                const isCorrect = (selectedOption === currentData.answer);
                if (isCorrect) score += 10; // 문항당 10점

                // 기록 저장 (예: "3 (X)", "4 (O)")
                userResponses.push(`${selectedOption + 1}번 ${isCorrect ? '(정답)' : '(오답)'}`);

                const buttons = optionsList.querySelectorAll('button');
                buttons.forEach((btn, idx) => {
                    btn.disabled = true;
                    if (idx === currentData.answer) {
                        btn.className = "w-full text-left p-4 rounded-xl border-2 border-emerald-500 bg-emerald-50 text-emerald-900 font-bold text-sm";
                    } else if (idx === selectedOption && !isCorrect) {
                        btn.className = "w-full text-left p-4 rounded-xl border-2 border-rose-500 bg-rose-50 text-rose-900 font-bold text-sm line-through opacity-70";
                    }
                });

                feedbackBox.classList.remove('hidden');
                feedbackBox.className = isCorrect ? "mb-6 rounded-xl p-4 border border-emerald-200 bg-emerald-50 text-emerald-800" : "mb-6 rounded-xl p-4 border border-rose-200 bg-rose-50 text-rose-800";
                document.getElementById('feedback-title').textContent = isCorrect ? "✅ 정답입니다!" : "❌ 틀렸습니다.";
                document.getElementById('feedback-rationale').textContent = currentData.rationale;
                
                actionBtn.textContent = currentIndex === quizData.length - 1 ? "제출 및 결과 보기" : "다음 문항";
            } else {
                // 다음 문제 또는 완료
                if (currentIndex < quizData.length - 1) {
                    currentIndex++;
                    renderQuestion();
                } else {
                    submitResults();
                }
            }
        };

        // 4. 구글 시트로 데이터 전송
        function submitResults() {
            quizScreen.classList.add('hidden');
            resultScreen.classList.remove('hidden');

            const formData = new FormData();
            formData.append('grade', studentData.grade);
            formData.append('classNum', studentData.classNum);
            formData.append('studentNum', studentData.num);
            formData.append('name', studentData.name);
            formData.append('score', score);
            
            userResponses.forEach((res, i) => {
                formData.append(`q${i+1}`, res);
            });

            // 데이터 전송 (CORS 방지용 mode: no-cors 사용)
            fetch(SCRIPT_URL, {
                method: 'POST',
                body: formData,
                mode: 'no-cors' 
            }).then(() => {
                // 전송 성공(또는 no-cors로 성공적 통신완료) 시 화면 전환
                document.getElementById('loading-spinner').classList.add('hidden');
                document.getElementById('success-content').classList.remove('hidden');
                document.getElementById('success-content').classList.add('flex');
                document.getElementById('final-score').textContent = `${score} / 100 점`;
            }).catch(err => {
                alert("서버 저장 중 오류가 발생했습니다. 네트워크를 확인해주세요.");
                document.getElementById('loading-spinner').innerHTML = `<p class="text-rose-500 font-bold">전송 실패</p>`;
            });
        }
    </script>
</body>
</html>
